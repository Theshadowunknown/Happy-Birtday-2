<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amplop Spesial 🎂</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
            position: relative;
        }

        .stars {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .star {
            position: absolute;
            width: 3px; height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        .sparkle-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .sparkle {
            position: absolute;
            width: 6px; height: 6px;
            background: #ffd700;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: sparkleAnim var(--sp-duration) ease-in-out infinite;
            opacity: 0;
            filter: drop-shadow(0 0 6px #ffd700);
        }
        @keyframes sparkleAnim {
            0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 0.9; transform: scale(1) rotate(180deg); }
        }

        .click-prompt {
            position: fixed; bottom: 50px; left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1rem;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.6s ease;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }
        .click-prompt.visible { opacity: 1; animation: promptBreathe 2.5s ease-in-out infinite; }
        @keyframes promptBreathe {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.5; }
            50% { transform: translateX(-50%) scale(1.04); opacity: 1; }
        }

        .envelope-wrapper {
            position: relative;
            z-index: 55;
            filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.5));
        }

        .envelope {
            position: relative;
            width: 360px;
            height: 250px;
            cursor: pointer;
        }

        /* ===== BODY ===== */
        .env-body {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            background: #ffffff;
            border-radius: 6px 6px 18px 18px;
            z-index: 2;
            box-shadow:
                inset 0 2px 4px rgba(255, 255, 255, 0.8),
                inset 0 -3px 8px rgba(0, 0, 0, 0.04),
                0 4px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 1px solid #d0d0d0;
        }
        .env-body::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                repeating-linear-gradient(90deg, transparent, transparent 24px, #e5e5e5 24px, #e5e5e5 25px),
                repeating-linear-gradient(0deg, transparent, transparent 24px, #e5e5e5 24px, #e5e5e5 25px);
            pointer-events: none;
            opacity: 0.7;
        }

        /* ===== FLAP ===== */
        .env-flap {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 70%;
            background: #ffffff;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top center;
            transition: transform 0.6s ease;
            z-index: 4;
            border: 1px solid #d0d0d0;
            border-bottom: none;
        }
        .env-flap.open {
            transform: rotateX(105deg);
            z-index: 1;
        }

        /* ===== SIDE FOLDS ===== */
        .env-side-left {
            position: absolute;
            bottom: 0; left: 0;
            width: 25%; height: 72%;
            background: linear-gradient(90deg, rgba(0,0,0,0.04), transparent);
            clip-path: polygon(0 0, 100% 0, 0 100%);
            z-index: 3;
            pointer-events: none;
        }
        .env-side-right {
            position: absolute;
            bottom: 0; right: 0;
            width: 25%; height: 72%;
            background: linear-gradient(270deg, rgba(0,0,0,0.04), transparent);
            clip-path: polygon(100% 0, 0 0, 100% 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* ===== SEAL dengan PIN MERAH ===== */
        .env-seal {
            position: absolute;
            top: 24%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            transition: all 0.5s ease;
        }
        .env-seal-inner {
            width: 68px; height: 68px;
            background: radial-gradient(circle at 35% 35%, #d42636, #8b1020 60%, #5a0a14);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow:
                0 2px 15px rgba(139, 16, 32, 0.4),
                inset 0 -2px 6px rgba(0,0,0,0.3),
                inset 0 2px 6px rgba(255,255,255,0.15);
            border: 2px solid rgba(180, 50, 50, 0.3);
        }
        .env-seal-inner::after {
            content: '';
            position: absolute;
            top: 12%; left: 20%;
            width: 35%; height: 25%;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            transform: rotate(-30deg);
        }
        .env-seal.hidden {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.4);
            pointer-events: none;
        }

        /* ===== RIBBON ===== */
        .ribbon {
            position: absolute;
            top: -8px; left: 50%;
            transform: translateX(-50%);
            z-index: 7;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.6s ease 0.3s;
        }
        .ribbon.visible { opacity: 1; }
        .ribbon-piece {
            width: 16px; height: 40px;
            background: linear-gradient(180deg, #ff6b8a, #e6395a);
            border-radius: 8px 8px 3px 3px;
            box-shadow: 0 2px 8px rgba(230, 57, 90, 0.3);
            transform-origin: top center;
        }
        .ribbon-piece:nth-child(1) { transform: rotate(-12deg); }
        .ribbon-piece:nth-child(2) { height: 50px; }
        .ribbon-piece:nth-child(3) { transform: rotate(12deg); }

        /* ===== INNER ===== */
        .env-inner {
            position: absolute;
            bottom: 5%; left: 6%;
            width: 88%; height: 62%;
            background: linear-gradient(155deg, #fffdf5, #f5f0e0);
            border-radius: 4px;
            z-index: 1;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease 0.15s;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            border: 1px solid rgba(200, 180, 140, 0.2);
        }
        .env-inner.visible { opacity: 1; transform: translateY(0); }

        .inner-emoji {
            font-size: 2.8rem;
            animation: emojiPop 1.5s ease-in-out infinite;
        }
        @keyframes emojiPop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .inner-text {
            color: #2a1a0a;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .btn-open {
            margin-top: 10px;
            padding: 12px 36px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #ff6b8a, #e6395a);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 8px 25px rgba(230, 57, 90, 0.35);
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            letter-spacing: 0.5px;
        }
        .btn-open.visible { opacity: 1; pointer-events: all; transform: translateY(0); }
        .btn-open:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 12px 35px rgba(230, 57, 90, 0.5);
        }
        .btn-open:active { transform: translateY(0) scale(0.97); }

        .float-particle {
            position: absolute;
            font-size: 1rem;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            animation: floatParticle 4s ease-in-out infinite;
        }
        @keyframes floatParticle {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }

        @media (max-width: 600px) {
            .envelope { width: 280px; height: 200px; }
            .env-seal-inner { width: 52px; height: 52px; font-size: 1.5rem; }
            .click-prompt { font-size: 0.9rem; bottom: 35px; }
            .inner-emoji { font-size: 2.2rem; }
            .inner-text { font-size: 0.9rem; }
            .btn-open { padding: 11px 28px; font-size: 0.9rem; }
            .ribbon-piece { width: 12px; height: 32px; }
            .ribbon-piece:nth-child(2) { height: 40px; }
        }
        @media (max-width: 400px) {
            .envelope { width: 230px; height: 170px; }
            .env-seal-inner { width: 42px; height: 42px; font-size: 1.2rem; }
            .env-inner { padding: 12px; }
            .inner-text { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>
    <div class="sparkle-container" id="sparkleContainer"></div>

    <div class="float-particle" style="top:20%;left:15%;animation-delay:0.2s">✨</div>
    <div class="float-particle" style="top:15%;right:20%;animation-delay:1s">⭐</div>
    <div class="float-particle" style="bottom:25%;left:10%;animation-delay:2.2s">💫</div>
    <div class="float-particle" style="bottom:20%;right:15%;animation-delay:3.5s">✨</div>

    <div class="click-prompt" id="clickPrompt">📌 Klik amplop untuk membuka 📌</div>

    <div class="envelope-wrapper">
        <div class="envelope" id="envelope">

            <div class="env-body"></div>

            <div class="env-side-left"></div>
            <div class="env-side-right"></div>

            <div class="env-flap" id="envFlap"></div>

            <div class="ribbon" id="ribbon">
                <div class="ribbon-piece"></div>
                <div class="ribbon-piece"></div>
                <div class="ribbon-piece"></div>

            <div class="env-seal" id="envSeal">
                <div class="env-seal-inner">📍</div>

            <div class="env-inner" id="envInner">
                <div class="inner-emoji">🎉</div>
                <div class="inner-text">Ada kejutan spesial untukmu...</div>
                <button class="btn-open" id="btnOpen">🎊 Buka Ucapan 🎊</button>
            </div>
    </div>

    <script>
        (function() {
            var c = document.getElementById('stars');
            if (!c) return;
            for (var i = 0; i < 200; i++) {
                var s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
                s.style.animationDelay = Math.random() * 4 + 's';
                s.style.width = s.style.height = (1 + Math.random() * 3) + 'px';
                c.appendChild(s);
            }
        })();

        (function() {
            var c = document.getElementById('sparkleContainer');
            if (!c) return;
            for (var i = 0; i < 15; i++) {
                var s = document.createElement('div');
                s.className = 'sparkle';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.setProperty('--sp-duration', (2 + Math.random() * 3) + 's');
                s.style.animationDelay = Math.random() * 5 + 's';
                s.style.width = s.style.height = (4 + Math.random() * 6) + 'px';
                c.appendChild(s);
            }
        })();

        var envelope = document.getElementById('envelope');
        var envFlap = document.getElementById('envFlap');
        var envSeal = document.getElementById('envSeal');
        var envInner = document.getElementById('envInner');
        var clickPrompt = document.getElementById('clickPrompt');
        var btnOpen = document.getElementById('btnOpen');
        var ribbon = document.getElementById('ribbon');
        var opened = false;

        envelope.style.opacity = '0';
        envelope.style.transform = 'translateX(-250px) rotate(-12deg) scale(0.5)';
        envelope.style.filter = 'blur(4px)';

        setTimeout(function() {
            envelope.style.transition = 'all 1.4s cubic-bezier(0.22, 1, 0.36, 1)';
            envelope.style.opacity = '1';
            envelope.style.transform = 'translateX(0) rotate(0deg) scale(1)';
            envelope.style.filter = 'blur(0)';
        }, 400);

        setTimeout(function() {
            if (clickPrompt) clickPrompt.classList.add('visible');
        }, 2200);

        envelope.addEventListener('click', function() {
            if (opened) return;
            opened = true;
            if (clickPrompt) clickPrompt.classList.remove('visible');

            envelope.style.transition = 'transform 0.3s ease';
            envelope.style.transform = 'translateY(-4px)';

            setTimeout(function() {
                if (envFlap) envFlap.classList.add('open');
                if (envSeal) envSeal.classList.add('hidden');
                if (ribbon) ribbon.classList.add('visible');
                if (envInner) envInner.classList.add('visible');
            }, 300);

            setTimeout(function() {
                envelope.style.transition = 'transform 0.3s ease';
                envelope.style.transform = 'translateY(0)';
            }, 500);

            setTimeout(function() {
                if (btnOpen) btnOpen.classList.add('visible');
            }, 1000);
        });

        if (btnOpen) {
            btnOpen.addEventListener('click', function() {
                window.location.href = 'Ultah.html';
            });
        }
    </script>

</body>
</html>
