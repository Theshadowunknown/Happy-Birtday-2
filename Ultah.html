<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun! 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars" id="stars"></div>

    <div class="balloon-container" id="balloonContainer"></div>

    <canvas id="confettiCanvas"></canvas>

    <div class="card-wrapper" id="cardWrapper">
        <div class="card">
            <div class="emoji-row">🎉🎂🎈</div>
            <h1 class="title">🎊 Selamat Ulang Tahun! 🎊</h1>
            <p class="subtitle">~ Happy Birthday rara~</p>
            <div class="message-area">
                <p class="message" id="birthdayMessage"></p>
            </div>
            <div class="nav-section">
                <button class="btn btn-small" id="prevBtn" disabled>◀ Sebelumnya</button>
                <span class="msg-counter" id="msgCounter">1 / 4</span>
                <button class="btn btn-small" id="nextBtn">Selanjutnya ▶</button>
            </div>
            <div class="secret-section">
                <button class="btn-secret" id="secretBtn">Tombol Music 🎵</button>
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
